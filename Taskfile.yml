version: '3'

vars:
  PROJECT_NAME: zeroclaw-enterprise
  DOCKER_COMPOSE: docker-compose -p {{.PROJECT_NAME}}

tasks:
  # --- 初期セットアップ ---
  init:
    desc: 帝国の初期環境構築（.env作成とフォルダ準備）
    cmds:
      - cp -n .env.example .env || true
      - cp -n mcp/gateway.env.example mcp/gateway.env || true
      - mkdir -p prompts skills storage/postgres mcp/vault
      - echo "帝国が開国されました。各.envファイルにAPIキーを入力してください。"

  # --- 起動・停止 ---
  up:
    desc: 円卓の64人を召喚（コンテナ起動）
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d --build"
      - task: status

  down:
    desc: 帝国を一時閉国
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  status:
    desc: 帝国の稼働状況確認
    cmds:
      - "{{.DOCKER_COMPOSE}} ps"

  # --- 開発・デバッグ ---
  logs:
    desc: 64名の思考ログをリアルタイム監視
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f zeroclaw"

  # --- 多言語環境のメンテナンス ---
  polyglot-refresh:
    desc: JS/PHP/Go/Rust の実行サンドボックスを再構築
    cmds:
      - docker build -t imperial-polyglot-runner ./skills/runtimes
      - echo "多言語ランタイムが更新されました。"

  # --- MCPサーバー（神器）の管理 ---
  mcp-sync:
    desc: 39のスキル（MCPサーバー）を最新化
    cmds:
      - docker restart mcp-gateway
      - echo "39の神器が再同期されました。"

  # --- 知識基盤 (Context7) の更新 ---
  knowledge-update:
    desc: 過去の資産や設計書を Context7 へ再インデックス
    cmds:
      - "{{.DOCKER_COMPOSE}} exec zeroclaw python scripts/sync_knowledge.py"

  # --- 帝国始動：CTOへの号令 ---
  start:
    desc: CTO（技術総帥）にプロジェクト開始を命じる
    summary: |
      使用法: task start MSG="[プロジェクト概要]"
      例: task start MSG="RustとNext.jsで暗号通貨ウォレットアプリを作れ。法務チェックも忘れるな。"
    cmds:
      - |
        curl -X POST http://localhost:42617/api/orchestrate \
          -H "Authorization: Bearer ${LITELLM_MASTER_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"instruction": "{{.MSG}}"}'
    preconditions:
      - sh: "[ -n '{{.MSG}}' ]"
        msg: "指令（MSG）を入力してください。"

  # --- 監査・クリーンアップ ---
  audit:
    desc: セキュリティ監査部による全ログのスキャン
    cmds:
      - "{{.DOCKER_COMPOSE}} exec zeroclaw python scripts/security_audit.py"

  clean:
    desc: 一時ファイルとキャッシュの破棄
    cmds:
      - rm -rf storage/postgres/*
      - docker system prune -f