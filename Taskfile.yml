version: '3'

# ルートの .env を Task から参照（存在しない場合は無視されない環境もあるため、先に task setup を推奨）
dotenv: ['.env']

# =============================================================================
# 帝国全軍指揮用変数 (Global Variables)
# =============================================================================
vars:
  PROJECT_NAME: zeroclaw-enterprise
  # Compose V2: docker-compose.yml の top-level `name:` がプロジェクト名になる
  DOCKER_COMPOSE: docker compose
  # config.toml に基づく既定ポート
  API_PORT: 42617 
  # バニラ状態の標準モデル
  VANILLA_MODEL: "gemma3:12b"
  # Rust管理ツールのパス
  MGMT_PATH: "./scripts/management"

# =============================================================================
# 帝国管理タスク (Imperial Tasks)
# =============================================================================
tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list-all

  # ---------------------------------------------------------------------------
  # 1. 建国・初期化 (Setup & Initialization)
  # ---------------------------------------------------------------------------
  setup:
    desc: 帝国の建国準備（環境変数・ディレクトリ・権限設定）
    summary: |
      初期セットアップを全自動で行います。
      1. .env ファイルの生成
      2. 必要な作業ディレクトリの作成
      3. DB初期化スクリプトへの実行権限付与
    cmds:
      - cp -n .env.example .env || true
      - cp -n mcp/gateway.env.example mcp/gateway.env || true
      - mkdir -p prompts skills storage/postgres mcp/vault
      - chmod +x postgres-init/01-init-databases.sh
      - echo "建国準備完了。各 .env にAPIキーを入力後、'task up' を実行してください。"

  # ---------------------------------------------------------------------------
  # 2. 進軍・戦線展開 (Infrastructure Control)
  # ---------------------------------------------------------------------------
  up:
    desc: コアスタックを起動（Postgres / Redis / Ollama / LiteLLM / MCP Gateway）
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d"
      - task: status

  up-with-zeroclaw:
    desc: ZeroClaw コンテナも起動（--profile zeroclaw。OSS イメージと config の互換は要確認）
    cmds:
      - "{{.DOCKER_COMPOSE}} --profile zeroclaw up -d"
      - task: status

  compose-validate:
    desc: docker compose 定義の検証（環境変数展開と YAML）
    cmds:
      - "{{.DOCKER_COMPOSE}} config --quiet"

  down:
    desc: 戦線を縮小し、全軍を帰還させる（コンテナ停止）
    cmds:
      - "{{.DOCKER_COMPOSE}} down"

  status:
    desc: 帝国の各司令部（コンテナ）の稼働状況を確認
    cmds:
      - "{{.DOCKER_COMPOSE}} ps"

  logs:
    desc: コアサービス（litellm / ollama / postgres）のログを追跡
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f litellm ollama postgres"

  logs-zeroclaw:
    desc: ZeroClaw コンテナのログ（--profile zeroclaw で起動した場合）
    cmds:
      - "{{.DOCKER_COMPOSE}} logs -f zeroclaw"

  # ---------------------------------------------------------------------------
  # 3. 兵装整備 (Model & Runtime Logistics)
  # ---------------------------------------------------------------------------
  ollama-pull:
    desc: バニラ推論モデル (gemma3:12b) を取得
    cmds:
      - "{{.DOCKER_COMPOSE}} exec ollama ollama pull {{.VANILLA_MODEL}}"

  polyglot-build:
    desc: 多言語実行サンドボックス (JS/PHP/Go/Rust) を再構築
    cmds:
      - docker build -t imperial-polyglot-runner ./skills/runtimes
      - echo "多言語ランタイムの同期が完了しました。"

  mcp-sync:
    desc: 39の神器（MCPサーバー）を再同期
    cmds:
      - "{{.DOCKER_COMPOSE}} restart mcp-gateway"
      - echo "全ツールが再接続されました。"

  # ---------------------------------------------------------------------------
  # 4. 皇帝の号令 (Orchestration & Commands)
  # ---------------------------------------------------------------------------
  command:
    desc: CTO（技術総帥）へプロジェクトの制圧を命じる
    summary: |
      皇帝（ユーザー）からCTOへ直接指令を送ります。
      使用法: task command MSG="[具体的な指令]"
    vars:
      LITELLM_KEY:
        sh: grep LITELLM_MASTER_KEY .env | cut -d '=' -f2
    cmds:
      - |
        curl -X POST http://localhost:{{.API_PORT}}/api/orchestrate \
          -H "Authorization: Bearer {{.LITELLM_KEY}}" \
          -H "Content-Type: application/json" \
          -d '{"instruction": "{{.MSG}}"}'
    preconditions:
      - sh: "[ -n '{{.MSG}}' ]"
        msg: "指令（MSG）を入力してください。例: task command MSG='Rustで高速Webサーバーを構築せよ'"

  # ---------------------------------------------------------------------------
  # 5. 帝国統治 (Rust Management & Audit)
  # ---------------------------------------------------------------------------
  sync:
    desc: "[Rust] 過去の資産やWikiを知識基盤 (Context7) へ同期"
    cmds:
      - cargo run --manifest-path {{.MGMT_PATH}}/Cargo.toml -- sync

  audit:
    desc: "[Rust] 全クルーの監査ログをスキャンし、セキュリティ事案を検知"
    cmds:
      - cargo run --manifest-path {{.MGMT_PATH}}/Cargo.toml -- audit

  check:
    desc: "[Rust] 帝国のインフラ（Ollama/LiteLLM/DB）の生存確認"
    cmds:
      - cargo run --manifest-path {{.MGMT_PATH}}/Cargo.toml -- status

  # ---------------------------------------------------------------------------
  # 6. 浄化 (Maintenance & Cleanup)
  # ---------------------------------------------------------------------------
  clean:
    desc: 一時ファイルとキャッシュの破棄
    cmds:
      - rm -rf storage/postgres/*
      - docker system prune -f
      - echo "帝国の全領域を浄化しました。"

  purge:
    desc: データベースを含む全データを完全抹消（注意：復旧不可）
    prompt: 本当に全てのデータを削除しますか？
    cmds:
      - "{{.DOCKER_COMPOSE}} down -v"