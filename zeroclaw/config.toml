# =============================================================================
# ZeroClaw Enterprise Configuration - The Sovereign 64
# =============================================================================

[server]
port = 42617
log_level = "info"
audit_log = true # 全操作の監査ログを記録

[storage]
provider = "postgres"
url = "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ZEROCLAW_DB_NAME}"
max_connections = 350 # 64名のエージェントと並列解析プロセスを支える

[llm]
provider = "openai"
base_url = "http://litellm:4000/v1"
api_key = "${LITELLM_MASTER_KEY}"
model = "${DEFAULT_MODEL}"
timeout_sec = 900 # 長大な法務監査や多言語コンパイル時間を考慮
max_retries = 3

[mcp]
enabled = true
url = "http://mcp-gateway:8811/sse"
tool_timeout_sec = 300

