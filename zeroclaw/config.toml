# =============================================================================
# ZeroClaw Enterprise Configuration - The Sovereign 64
# =============================================================================
#
# latest イメージは [llm] / [server] / [[crews]] を無視する。プロバイダはルートまたは ZEROCLAW_PROVIDER。ベース URL は OPENAI_API_URL 等（api_url は無視されるビルドあり）。
default_provider = "openai"

[server]
port = 42617
log_level = "info"
audit_log = true # 全操作の監査ログを記録

# [memory].backend は sqlite | markdown | qdrant | lucid | none（postgres は未対応 → unknown で markdown フォールバックになる）
[memory]
backend = "sqlite"
auto_save = true

# ghcr.io/zeroclaw-labs/zeroclaw の既定ビルドは [memory].backend の postgres を解釈せず警告になる。
# かつ [storage.provider.config] の provider がメモリ側に取り込まれて "postgres" 扱いになる事例があるため、
# 公式イメージでは sqlite のみ使用する。Postgres 永続化が必要なカスタムビルドでは公式ドキュメントに従って復元する。

[llm]
provider = "openai"
base_url = "http://litellm:4000/v1"
api_key = "${LITELLM_MASTER_KEY}"
# Compose の DEFAULT_MODEL（litellm_config.yaml の model_name と一致。例: imperial-logic-high-v1）
model = "${DEFAULT_MODEL}"
timeout_sec = 900 # 長大な法務監査や多言語コンパイル時間を考慮
max_retries = 3

[mcp]
enabled = true
# 公式スキーマ: リモート MCP は [[mcp.servers]]。deferred_loading=false でゲートウェイ配下のツールを起動時に登録。
deferred_loading = false

[[mcp.servers]]
name = "docker-mcp-gateway"
transport = "sse"
url = "http://mcp-gateway:8811/sse"
command = ""
args = []

[mcp.servers.env]

[mcp.servers.headers]

