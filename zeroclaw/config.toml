description = "ユーザー窓口。製品知識と外部検索を駆使した高度な回答。"
prompt_file = "prompts/support_engineer.md"
skills = ["web_search", "knowledge_base", "enterprise_docs"]
temperature = 0.2

[[crews]]
name = "technical_writer"
description = "全工程から高精度なドキュメントとマニュアルを自動生成。"
prompt_file = "prompts/tech_writer.md"
skills = ["filesystem", "github_api", "wiki_management", "diagram_generation", "knowledge_base"]
temperature = 0.1

# =============================================================================
# [skills]（公式）: open-skills 等のグローバル設定。キー名が旧 [[skills]] と衝突するためテーブル配列は使えない。
# crew の skills = ["market_research", ...] はエージェント用スキル ID。MCP ツールは docker-mcp-gateway 1 本でまとめて提供。
# 旧 name → mcp_server 対応表は mcp/README.md のマトリクスを参照。
# =============================================================================
[skills]
open_skills_enabled = false
prompt_injection_mode = "compact"