# =============================================================================
# LiteLLM Configuration - The Sovereign 64 (Imperial Communication Hub)
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # ローカル推論: rust-inference（llama.cpp SYCL / llama-server・OpenAI 互換）
  # ---------------------------------------------------------------------------
  - model_name: imperial-logic-high-v1
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://rust-inference:8080/v1
      api_key: dummy-key
      timeout: 300
      tpm: 100000
      rpm: 1000

  - model_name: imperial-build-knight-v1
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://rust-inference:8080/v1
      api_key: dummy-key
      timeout: 600

  - model_name: imperial-scout-mini-v1
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://rust-inference:8080/v1
      api_key: dummy-key
      timeout: 120

  # .env の DEFAULT_MODEL は上記のいずれかの model_name と一致させる（例: imperial-logic-high-v1）。
  # model_list に無い名前は OpenAI 互換パススルーになり、意図しない 401 になり得る。

  # ---------------------------------------------------------------------------
  # クラウド LLM（必要時にコメント解除）
  # ---------------------------------------------------------------------------
  # - model_name: imperial-logic-high-v1
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #     rpm: 500

# =============================================================================
# ルーティング & フォールバック設定
# =============================================================================

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  retry_after: 5
  set_verbose: false

# =============================================================================
# グローバル設定
# =============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/POSTGRES_URL
  store_model_usage: true

litellm_settings:
  cache: true
  cache_type: redis
  drop_params: true
  success_callback: []
  failure_callback: []

# =============================================================================
# 監査・セキュリティ設定
# =============================================================================
# Langfuse を有効にする場合: docker compose --profile ui 起動後、
# success_callback / failure_callback に langfuse を追加するか、専用 config をマウントしてください。

metadata:
  project: "zeroclaw-enterprise"
  tier: "sovereign-64"
