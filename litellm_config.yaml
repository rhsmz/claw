# =============================================================================
# LiteLLM Configuration - The Sovereign 64 (Imperial Communication Hub)
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # 1. バニラ設定: ローカル推論エンジン (Ollama)
  # ---------------------------------------------------------------------------
  # 帝国の標準OS。コストゼロで24時間稼働する基幹モデル。
  
  - model_name: imperial-logic-high-v1  # 指揮官・アーキテクト・法務用
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434
      timeout: 300
      tpm: 100000
      rpm: 1000

  - model_name: imperial-build-knight-v1 # 開発部隊・ウィザード用
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434
      timeout: 600

  - model_name: imperial-scout-mini-v1  # 調査・諜報・サポート・文書生成用
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434
      timeout: 120

  # .env の DEFAULT_MODEL（例: gemma3:12b）と zeroclaw/config.toml の model を一致させる
  - model_name: gemma3:12b
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434
      timeout: 300

  # ---------------------------------------------------------------------------
  # 2. 追加設定: クラウドLLM (必要に応じてコメントアウトを解除して有効化)
  # ---------------------------------------------------------------------------
  # 極めて複雑な論理推論や、大規模なコード生成が必要な場合に切り替えます。

  # --- OpenAI Stack ---
  # - model_name: imperial-logic-high-v1
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY
  #     rpm: 500

  # - model_name: imperial-scout-mini-v1
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

  # --- Anthropic Stack ---
  # - model_name: imperial-build-knight-v1
  #   litellm_params:
  #     model: anthropic/claude-3-5-sonnet-20240620
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #     rpm: 200

# =============================================================================
# ルーティング & フォールバック設定
# =============================================================================

router_settings:
  # 負荷ベースのルーティング。複数のOllamaインスタンスがある場合に有効。
  routing_strategy: usage-based-routing-v2

  # フォールバックは fallbacks リストで定義（未定義ならモデル間フォールバックなし）。enable_fallbacks は現行 Router で未サポート。

  # エラー発生時の自動リトライ設定
  num_retries: 3
  retry_after: 5
  set_verbose: false

# =============================================================================
# グローバル設定
# =============================================================================

general_settings:
  # config.toml の [llm] セクションからの認証に使用。
  master_key: os.environ/LITELLM_MASTER_KEY 
  
  # 実行統計・トークン消費量を記録。
  database_url: os.environ/POSTGRES_URL 
  store_model_usage: true

litellm_settings:
  # 推論結果をキャッシュして応答を高速化し、トークンを節約。
  cache: true
  cache_type: redis

  # 未知のパラメータが送られてきてもエラーにせず無視する。
  drop_params: true

  # Langfuse を compose に含めない既定スタックではコールバックを空にする
  success_callback: []
  failure_callback: []

# =============================================================================
# 監査・セキュリティ設定
# =============================================================================
# セキュリティ監査部（The INTEL Pod）がログを収集しやすくするための設定。

# ユーザーID（クルー名）をメタデータとして付与し、誰がどのモデルを叩いたか追跡。
metadata:
  project: "zeroclaw-enterprise"
  tier: "sovereign-64"