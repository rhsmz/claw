# LiteLLM プロキシ: ローカル Ollama + 任意のクラウド LLM を同一 OpenAI 互換 API に集約し Langfuse にコールバック
# https://docs.litellm.ai/docs/proxy/configs
#
# クラウド系は api_key: os.environ/... のため、docker-compose の litellm に渡す .env 側でキーを設定する。
# キー未設定のまま当該モデルを呼ぶとリクエスト時にエラーになる（プロキシ起動は通常可能）。

model_list:
  # --- ローカル Ollama（api_base は compose ネットワーク内ホスト名）---
  # .env の DEFAULT_MODEL は、ここに列挙した model_name のいずれかに合わせる。

  - model_name: llama3.1
    litellm_params:
      model: ollama/llama3.1
      api_base: http://ollama:11434

  - model_name: gemma3:12b
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434

  # --- 外部 LLM（.env に API キーを設定したとき利用可能）---
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # モデル ID はプロバイダの最新表記に合わせて更新すること（LiteLLM ドキュメント参照）
  - model_name: claude-3-5-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
