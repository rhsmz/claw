model_list:
  # --- 指揮官・アーキテクト用 (最高知能) ---
  - model_name: grand-logic-model
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      timeout: 300

  # --- 開発部隊・ウィザード用 (コーディング特化) ---
  - model_name: code-master-model
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20240620
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 200

  # --- 調査・スカウト・サポート用 (高速・低コスト) ---
  - model_name: fast-scout-model
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 5000

  # --- セキュリティ・法務監査用 (長文コンテキスト) ---
  - model_name: heavy-audit-model
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 16384

# ロードバランシングとフォールバックの設定
router_settings:
  routing_strategy: usage-based-routing-v2 # 負荷の低いモデルを優先
  enable_fallbacks: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # config.tomlの認証に使用
  database_url: os.environ/POSTGRES_URL # 使用量統計を記録

litellm_settings:
  drop_params: true # サポート外のパラメータを自動削除
  set_verbose: false
  telemetry: false