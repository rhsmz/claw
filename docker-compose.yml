services:
  # データベース: Context7 (RAG) とエージェントの記憶用
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ZEROCLAW_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ZEROCLAW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 高速キャッシュ: バックエンド部隊の検証用
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning

  # LLMプロキシ: コスト管理・リトライ・冗長化の要
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "4000:4000"

  # MCP Gateway: 39のスキル（神器）を統合するハブ
  mcp-gateway:
    image: mcp/gateway:latest
    volumes:
      - ./mcp/config.json:/app/config.json
      - ./mcp/vault:/app/vault:ro # 機密情報
    environment:
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # ZeroClaw Server: 帝国の本体
  zeroclaw:
    build: .
    volumes:
      - ./config.toml:/app/config.toml
      - ./prompts:/app/prompts
      - ./skills:/app/skills
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "42617:42617"
    depends_on:
      - mcp-gateway
      - litellm

volumes:
  postgres_data: